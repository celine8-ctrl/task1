<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="肿瘤科规培完整去重选择题互动题库">
  <title>肿瘤科完整选择题题库</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <p class="eyebrow">ONCOLOGY · REVIEW BANK</p>
      <h1>肿瘤科完整选择题题库</h1>
      <p class="hero__summary">四套试卷合并去重，保留全部可识别题目。每道题均可独立作答、核对或显示答案。</p>
      <div class="hero__stats" aria-label="题库统计">
        <div><strong id="total-count">—</strong><span>去重题目</span></div>
        <div><strong id="completed-count">0</strong><span>已作答</span></div>
        <div><strong id="correct-count">0</strong><span>答对</span></div>
        <div><strong id="accuracy-rate">—</strong><span>正确率</span></div>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="notice" aria-label="使用说明">
      <div>
        <strong>完整覆盖 · 已去除重复题</strong>
        <p>题目来自扫描版原卷 OCR。药名、剂量和临床结论请以原始资料与现行规范为准。</p>
      </div>
      <button id="reset-all" class="button button--quiet" type="button">清空全部记录</button>
    </section>

    <section class="toolbar" aria-label="题库筛选">
      <div id="tabs" class="tabs" role="tablist" aria-label="题型"></div>
      <div class="filters">
        <label class="search">
          <span>搜索</span>
          <input id="search-input" type="search" placeholder="题干、药物、护理措施…" autocomplete="off">
        </label>
        <label>
          <span>状态</span>
          <select id="status-filter">
            <option value="all">全部题目</option>
            <option value="unanswered">未作答</option>
            <option value="correct">已答对</option>
            <option value="incorrect">待巩固</option>
            <option value="revealed">已看答案</option>
          </select>
        </label>
        <button id="reset-section" class="button button--quiet" type="button">重置本题型</button>
      </div>
      <div class="section-progress">
        <div>
          <strong id="section-title">单选题</strong>
          <span id="section-summary">0 / 0 已作答</span>
        </div>
        <div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div>
      </div>
    </section>

    <section id="question-list" class="question-list" aria-live="polite"></section>
    <div id="empty-state" class="empty-state" hidden>
      <strong>没有符合条件的题目</strong>
      <span>请更换关键词或筛选条件。</span>
    </div>
  </main>

  <button id="back-to-top" class="back-to-top" type="button" aria-label="返回顶部">↑</button>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
