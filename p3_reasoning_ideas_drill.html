<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Speaking P3｜重点推理默写纠错卷</title><style>:root{--ink:#172033;--muted:#64748b;--line:#d9e2ee;--brand:#2563c9;--ok:#15803d;--bad:#d6293e;--bg:#f4f7fb;--warm:#fff8e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.58 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:1040px;margin:28px auto;padding:0 20px 60px}h1{margin:0 0 4px;font-size:28px}h2{margin:0 0 8px;font-size:20px}.sub,.hint{color:var(--muted)}.card{margin:18px 0;padding:22px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #17203308}.notice{padding:12px 14px;border-left:4px solid #e7a321;background:var(--warm);border-radius:5px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab,button{padding:9px 13px;border:0;border-radius:7px;background:var(--brand);color:#fff;font:inherit;font-weight:650;cursor:pointer}.tab.off,button.secondary{background:#e9eef6;color:#334155}.item{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:16px 0;border-top:1px solid #edf1f6}.num{padding-top:7px;color:var(--brand);font-weight:750}.wrap{position:relative}.mirror{position:absolute;inset:0;z-index:1;overflow:hidden;white-space:pre;pointer-events:none;padding:9px 11px;border:1px solid transparent;border-radius:7px;background:#fff;font:inherit}.wrap.locked .mirror{background:#eef2f7;color:#64748b}input{width:100%;padding:9px 11px;border:1px solid #b8c5d7;border-radius:7px;outline:none;font:inherit}input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #2563c918}input.drill{position:relative;z-index:2;background:transparent;color:transparent;caret-color:var(--ink)}input.drill:disabled{background:transparent;cursor:not-allowed}.good{color:var(--ink)}.bad{color:var(--bad)}.feedback{margin-top:7px;font-size:14px}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}.answer{margin-top:10px;padding:13px 14px;border-radius:6px;white-space:pre-wrap;background:#fff7e8}.hidden{display:none}.mini{margin-top:8px;padding:6px 10px;font-size:13px}.score{margin-top:13px;padding:12px;border-radius:7px;background:#f7f9fc}@media(max-width:620px){main{padding:0 12px}.card{padding:16px}h1{font-size:23px}}</style></head><body><main><h1>IELTS Speaking Part 3｜重点推理默写纠错卷</h1><p class="sub">从人事景、社会现象、学习成长、景观与价值观中提炼的高迁移回答链。</p><section class="card"><div class="notice">按中文提示默写英文。输入正确文字为黑色，只有错误单词为红色；若只错一个词，会显示正确拼写。答对后才解锁下一题；标点和大小写不扣分。</div><div id="tabs" class="tabs"></div></section><section class="card"><h2 id="deckTitle"></h2><p id="deckIntro" class="hint"></p><div id="items"></div><p><button class="secondary" onclick="resetDeck()">本专题清空重做</button></p><div id="score" class="score"></div></section><section class="card"><h2>Part 3 使用提醒</h2><ol><li>每题用“观点 + 原因 + 例子/结果”回答，保持 3–5 句即可。</li><li>不要背整段；优先把句子中的人、地点、行为替换成题目对应内容。</li><li>当题目抽象时，优先调用第 00 专题的推理链。</li></ol></section></main><script src="p3_reasoning_ideas_drill.js"></script></body></html>
