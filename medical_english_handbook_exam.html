":"您是否有发热、咳嗽或呼吸困难等症状？","answers":["Do you have any symptoms of fever, cough, or difficulty breathing?"],"subsection":"急诊医生问诊","kind":"zh-en"},{"prompt":"作为预防措施, 我们需要隔离该患者。","answers":["We need to isolate the patient as a precaution."],"subsection":"急诊医生问诊","kind":"zh-en"},{"prompt":"患者需要立即做心电图/CT/超声/血液检查。","answers":["The patient needs ECG / CT scan / ultrasound / blood test."],"subsection":"开具急诊检查/治疗","kind":"zh-en"},{"prompt":"您需要拍X光片。","answers":["You need an X-ray."],"subsection":"开具急诊检查/治疗","kind":"zh-en"},{"prompt":"需要缝合伤口。","answers":["The wound needs suturing."],"subsection":"开具急诊检查/治疗","kind":"zh-en"},{"prompt":"请到急诊收费处缴费。","answers":["Please go to the emergency cashier."],"subsection":"缴费","kind":"zh-en"},{"prompt":"急救不会因缴费问题而延误。","answers":["Emergency care will not be delayed due to payment."],"subsection":"缴费","kind":"zh-en"},{"prompt":"无论保险状况如何,我们都会提供急救治疗。","answers":["We'll provide emergency treatment regardless of insurance status."],"subsection":"缴费","kind":"zh-en"},{"prompt":"请在方便时提供您的保险信息。","answers":["Please provide your insurance information when possible."],"subsection":"缴费","kind":"zh-en"},{"prompt":"总费用为XXX元。","answers":["The total is XXX yuan."],"subsection":"缴费","kind":"zh-en"},{"prompt":"您可以使用现金、银行卡或移动支付。","answers":["We accept cash, debit cards, credit cards, and mobile payments."],"subsection":"缴费","kind":"zh-en"},{"prompt":"请立即到急诊检验科抽血。","answers":["Please go to the Emergency Lab for blood work right away."],"subsection":"急诊检查与化验","kind":"zh-en"},{"prompt":"请带患者去放射科做CT/X光。","answers":["Please take the patient to Radiology for a CT scan / X-ray."],"subsection":"急诊检查与化验","kind":"zh-en"},{"prompt":"检查结果会尽快出来。","answers":["We'll have the results as soon as possible."],"subsection":"急诊检查与化验","kind":"zh-en"},{"prompt":"请在这里等候结果。","answers":["Please wait here for the results."],"subsection":"急诊检查与化验","kind":"zh-en"},{"prompt":"缴完费，请凭急诊处方和缴费凭证到急诊药房取药。","answers":["After payment, please go to the Emergency Pharmacy with your emergency prescription and payment receipt to collect your medication."],"subsection":"急诊取药与治疗","kind":"zh-en"},{"prompt":"请到治疗室进行输液/注射。","answers":["Please go to the treatment room for an IV or a shot."],"subsection":"急诊取药与治疗","kind":"zh-en"},{"prompt":"患者需要留院观察4-6小时。","answers":["The patient will need to be observed for 4–6 hours."],"subsection":"留观/住院/离院","kind":"zh-en"},{"prompt":"医生建议住院治疗。","answers":["The doctor recommends admission."],"subsection":"留观/住院/离院","kind":"zh-en"},{"prompt":"请到住院部办理住院手续。","answers":["Please go to the Inpatient Department to be admitted."],"subsection":"留观/住院/离院","kind":"zh-en"},{"prompt":"患者需要留院观察4-6小时。","answers":["The patient will need to be observed for 4-6 hours."],"subsection":"留观/住院/离院","kind":"zh-en"},{"prompt":"这是住院通知单。","answers":["Here is the admission letter."],"subsection":"留观/住院/离院","kind":"zh-en"},{"prompt":"请放心, 我们正在全力救治。","answers":["Try to relax. We're doing everything we can."],"subsection":"急诊常用安慰与沟通用语","kind":"zh-en"},{"prompt":"医护人员会一直在这里。","answers":["We'll be right here."],"subsection":"急诊常用安慰与沟通用语","kind":"zh-en"},{"prompt":"患者情况稳定, 可以离院。","answers":["The patient is stable and ready for discharge."],"subsection":"急诊常用安慰与沟通用语","kind":"zh-en"},{"prompt":"请按照医嘱服药,如有不适立即返回急诊。","answers":["Please take the medication as prescribed. Return to the Emergency Department immediately if you experience any problems."],"subsection":"急诊常用安慰与沟通用语","kind":"zh-en"},{"prompt":"请X天后到门诊复诊。","answers":["Please come back to the outpatient clinic in X days for a follow-up."],"subsection":"急诊常用安慰与沟通用语","kind":"zh-en"},{"prompt":"我们会及时通知您患者的病情变化。","answers":["We'll keep you informed of any changes."],"subsection":"急诊常用安慰与沟通用语","kind":"zh-en"},{"prompt":"您如果有任何需要,请随时告诉我们。","answers":["Don't hesitate to ask if you need anything."],"subsection":"急诊常用安慰与沟通用语","kind":"zh-en"}]},{"key":"Part3","title":"Part 3 · 分岗位情景会话","intro":"用于按角色串联完整对话，练习导医、挂号、问诊、护理、药房与急诊场景。","items":[{"prompt":"导医：早上好，请问有什么可以帮您？","answers":["Guide: Good morning. How may I help you?"],"sub mmary."],"subsection":"出院办理","kind":"zh-en"},{"prompt":"请按时复诊。","answers":["Please come back for follow-up on time."],"subsection":"健康指导","kind":"zh-en"},{"prompt":"请按医嘱服药。","answers":["Please take your medication as prescribed."],"subsection":"健康指导","kind":"zh-en"},{"prompt":"请注意休息,多喝水。","answers":["Please get enough rest and drink plenty of water."],"subsection":"健康指导","kind":"zh-en"},{"prompt":"请保持清淡饮食。","answers":["Please have a bland diet."],"subsection":"健康指导","kind":"zh-en"},{"prompt":"如果症状加重或出现新症状,请立即来医院。","answers":["If your symptoms get worse, or if you notice anything new, please come back to the hospital immediately."],"subsection":"健康指导","kind":"zh-en"},{"prompt":"谢谢您的配合。","answers":["Thank you for your cooperation."],"subsection":"礼貌结束语","kind":"zh-en"},{"prompt":"祝您早日康复。","answers":["Wish you a speedy recovery."],"subsection":"礼貌结束语","kind":"zh-en"},{"prompt":"对不起,请您再说一遍。","answers":["Sorry, could you say that again?"],"subsection":"听不清/听不懂","kind":"zh-en"},{"prompt":"请您说慢一点。","answers":["Could you speak more slowly, please?"],"subsection":"听不清/听不懂","kind":"zh-en"},{"prompt":"请您说得简单一点。","answers":["Could you make it simpler, please?"],"subsection":"听不清/听不懂","kind":"zh-en"},{"prompt":"请把您的问题写下来。","answers":["Please write down your question."],"subsection":"听不清/听不懂","kind":"zh-en"},{"prompt":"请稍等, 我帮您确认。","answers":["Please wait a moment. I'll check it for you."],"subsection":"需要协助","kind":"zh-en"},{"prompt":"我帮您联系会英语的同事。","answers":["I'll contact a colleague who speaks English."],"subsection":"需要协助","kind":"zh-en"},{"prompt":"我马上叫医生/护士过来。","answers":["I'll call the doctor / nurse right away."],"subsection":"需要协助","kind":"zh-en"},{"prompt":"对不起，让您久等了。","answers":["Sorry to keep you waiting."],"subsection":"礼貌表达","kind":"zh-en"},{"prompt":"给您带来不便,敬请谅解。","answers":["We apologize for the inconvenience."],"subsection":"礼貌表达","kind":"zh-en"},{"prompt":"谢谢您的理解与配合。","answers":["Thank you for your understanding and cooperation."],"subsection":"礼貌表达","kind":"zh-en"}]}],"serviceRules":["主动问候，文明服务。","使用简洁、规范、易懂的英语表达。","保持语速适中、发音清晰。","对外宾提出的问题，应耐心听取、准确回答。","对听不懂、说不清的情况，应主动重复、解释或寻求协助。","注意保护患者隐私，尊重不同国家和地区的文化习惯。","遇到急危重症情况，应先行处置、同步沟通。"]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('exam-data').textContent);let current=0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>String(s).toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(Boolean);
const tabs=document.getElementById('tabs'),app=document.getElementById('app');
function render(){tabs.innerHTML='';app.innerHTML='';DATA.sections.forEach((sec,si)=>{const b=document.createElement('button');b.className='tab'+(si===current?' active':'');b.textContent=sec.title+' · '+sec.items.length;b.onclick=()=>{current=si;render();scrollTo({top:0,behavior:'smooth'})};tabs.appendChild(b);const pane=document.createElement('section');pane.className='section'+(si===current?' active':'');pane.dataset.section=si;pane.innerHTML='<div class="section-head"><div><h2>'+esc(sec.title)+'</h2><p>'+esc(sec.intro)+'</p></div><div class="actions"><span class="pill"><b class="progress">0</b> / '+sec.items.length+'</span><button class="reset">重置本节</button></div></div>'+(sec.key==='Part8'?'<aside class="rules"><strong>源资料服务规范（7 条）</strong><ul>'+DATA.serviceRules.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></aside>':'')+'<div class="items"></div>';app.appendChild(pane);buildItems(pane,sec)});}
function buildItems(pane,sec){const box=pane.querySelector('.items');sec.items.forEach((it,i)=>{const el=document.createElement('article');el.className='item'+(i?' locked':'');el.dataset.index=i;el.innerHTML='<div class="meta"><span>'+esc(it.subsection)+'</span><span>'+(i+1)+' / '+sec.items.length+'</span></div><div class="prompt">'+esc(it.prompt)+'</div><div class="answer-row"><div class="input-shell"><div class="mirror" aria-hidden="true"></div><textarea class="answer-input" rows="1" '+(i?'disabled':'')+' aria-label="请输入英文答案"></textarea></div><button class="show">显示答案</button></div><div class="feedback"></div>';box.appendChild(el);const input=el.querySelector('.answer-input');input.addEventListener('input',()=>judge(el,it,sec,pane));el.querySelector('.show').onclick=()=>showAnswer(el,it);});pane.querySelector('.reset').onclick=()=>resetSection(pane,sec);}
function bestExpected(typed,answers){let best=answers[0],score=Infinity;const tw=words(typed);for(const a of answers){const aw=words(a);let d=Math.abs(tw.length-aw.length);for(let i=0;i<Math.min(tw.length,aw.length);i++)if(tw[i]!==aw[i])d++;if(d<score){score=d;best=a}}return best;}
function paint(input,mirror,expected){const tw=input.value.split(/(\s+)/),aw=words(expected);let wi=0;mirror.innerHTML=tw.map(t=>{if(/^\s+$/.test(t))return t;const n=words(t)[0]||'';const ok=n&&n===aw[wi++];return '<span class="'+(ok?'':'bad')+'">'+esc(t)+'</span>'}).join('');}
function judge(el,it,sec,pane){const input=el.querySelector('.answer-input'),feedback=el.querySelector('.feedback'),expected=bestExpected(input.value,it.answers),tw=words(input.value),aw=words(expected);paint(input,el.querySelector('.mirror'),expected);const correct=it.answers.some(a=>words(a).join(' ')==tw.join(' '));if(correct){input.disabled=true;el.classList.add('done');feedback.className='feedback ok';feedback.textContent='正确 ✓';const next=el.nextElementSibling;if(next){next.classList.remove('locked');const ni=next.querySelector('.answer-input');ni.disabled=false;setTimeout(()=>ni.focus(),40)}updateProgress(pane);return}let wrong=0,at=-1;if(tw.length===aw.length){for(let i=0;i<aw.length;i++)if(tw[i]!==aw[i]){wrong++;at=i}}feedback.className='feedback'+(wrong===1?' hint':'');feedback.textContent=wrong===1?'拼写提示：'+tw[at]+' → '+aw[at]:'';}
function showAnswer(el,it){let old=el.querySelector('.revealed');if(old){old.remove();return}old=document.createElement('div');old.className='revealed';old.textContent=it.answers.join(' / ');el.appendChild(old)}
function updateProgress(pane){pane.querySelector('.progress').textContent=pane.querySelectorAll('.item.done').length}
function resetSection(pane,sec){pane.querySelectorAll('.item').forEach((el,i)=>{el.className='item'+(i?' locked':'');const input=el.querySelector('.answer-input');input.value='';input.disabled=i>0;el.querySelector('.mirror').innerHTML='';el.querySelector('.feedback').textContent='';el.querySelector('.feedback').className='feedback';el.querySelector('.revealed')?.remove()});updateProgress(pane);pane.querySelector('.answer-input')?.focus()}
render();
</script></body></html>
