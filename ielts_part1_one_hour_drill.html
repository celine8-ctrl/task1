<script>
const STUDY_SECTIONS=[{"id":"skeletons","title":"8类骨架","usage":"看到触发词先选骨架。方括号位置要照写英文占位词，考场再替换成题目内容。","items":[{"id":"L-骨架","prompt":"喜好类：直接表明喜欢，补充原因和一个个人细节。","answer":"Absolutely. I am a huge fan of [topic], mainly because [reason]. For example, [personal detail]."},{"id":"F-骨架","prompt":"频率类：给出明确频率、发生情境和实际好处。","answer":"I do it quite often, usually when [situation], because it helps me [benefit] in daily life."},{"id":"E-骨架","prompt":"经历类：回忆一次经历，并说明它带来的感受。","answer":"Definitely. I remember there was a time when [experience], which made me feel [result] afterwards."},{"id":"I-骨架","prompt":"重要性类：确认其重要作用，并落到具体生活场景。","answer":"Without a doubt, [topic] plays a significant role because [reason], especially when [situation] in daily life."},{"id":"N-骨架","prompt":"本国现象类：概括中国的普遍情况，并给出文化或实际原因。","answer":"Generally speaking, it is fairly common in China these days, mainly because [cultural or practical reason]."},{"id":"C-骨架","prompt":"选择对比类：按情境选择A或B，并形成自然对比。","answer":"It depends on the situation. I choose A when [condition], whereas B suits [different condition] for me."},{"id":"G-骨架","prompt":"列举类：先承认有多个答案，再突出最主要的一项。","answer":"There are several things, but the main one is [point], since it helps people [benefit]."},{"id":"O-骨架","prompt":"观点类：直接给出个人判断，再用理由和细节支撑。","answer":"Personally, I would say [answer]. The main reason is [reason], and [detail] supports that view."}]},{"id":"examples","title":"8个示例","usage":"练习完整的25–45词回答：直接回应、一个原因、一个个人细节。","items":[{"id":"L-示例","prompt":"完整示例：喜欢阅读，因为轮班后能放松并恢复精力。","answer":"Absolutely. I am a huge fan of reading because it helps me switch off after a demanding shift. For example, even twenty minutes with a novel can recharge my batteries and improve my mood."},{"id":"F-示例","prompt":"完整示例：每周下班后散步三四次，公园环境有助减压。","answer":"I walk three or four times a week after work. There is a park near my apartment where the fresh air helps me reduce stress and stay reasonably active."},{"id":"E-示例","prompt":"完整示例：大学带领女子赛艇队，艰苦训练带来自豪感。","answer":"Definitely. At college, I led an all-female rowing team which trained on the sea. It was demanding, but achieving goals together gave me a genuine sense of pride."},{"id":"I-示例","prompt":"完整示例：护理工作中保持有条理能节省时间并减少错误。","answer":"Without a doubt, organisation matters in nursing because it saves time and reduces mistakes. It is especially important during a busy shift, when patient safety depends on careful preparation."},{"id":"N-示例","prompt":"完整示例：中国城市养宠物较普遍，但繁忙人士会考虑责任成本。","answer":"Keeping pets is fairly common in Chinese cities because animals provide companionship. However, busy workers may hesitate, since responsible pet care requires considerable time and energy."},{"id":"C-示例","prompt":"完整示例：需要效率时打字，需要记住短笔记时手写。","answer":"I prefer typing when I need speed and efficiency, whereas handwriting suits short notes that I want to remember. For exam preparation, typing is usually more practical."},{"id":"G-示例","prompt":"完整示例：主要浏览护理和语言学习网站，为执照考试准备资源。","answer":"I visit several websites, but nursing and language-learning sites are the main ones. They provide reliable resources, which help me prepare for my international nursing licence efficiently."},{"id":"O-示例","prompt":"完整示例：与昂贵汽车相比，更愿意购买安全、可靠且实用的汽车。","answer":"I would buy a reliable car rather than an expensive one. Safety and running costs matter most to me, and comparing prices helps me make a practical decision."}]},{"id":"m1","title":"M1 护士工作与繁忙日程","usage":"覆盖主题：Tidiness, Memory, Morning Routines, Life stages。逐句默写后，再把三句口头连起来。","items":[{"id":"M1-1","prompt":"护士工作使日程繁忙。","answer":"I am a nurse, so my schedule is hectic."},{"id":"M1-2","prompt":"保持有条理有助于兼顾轮班与备考。","answer":"Staying organised helps me manage shifts and exam preparation."},{"id":"M1-3","prompt":"查看计划并用提醒避免遗漏。","answer":"I check my plan and use reminders so that I do not miss something important."}]},{"id":"m2","title":"M2 阅读、音乐与放松","usage":"覆盖主题：Music, Reading, Childhood activities, Morning Routines。逐句默写后，再把三句口头连起来。","items":[{"id":"M2-1","prompt":"阅读和轻柔音乐是放松方式。","answer":"Reading and gentle music are ways to unwind."},{"id":"M2-2","prompt":"轮班后用它们放空并恢复精力。","answer":"After a shift, they help me switch off and recharge my batteries."},{"id":"M2-3","prompt":"喜欢故事深刻而怀旧的粤语悲歌。","answer":"I enjoy sad Cantonese songs because their stories feel meaningful and nostalgic."}]},{"id":"m3","title":"M3 公园、散步与自然","usage":"覆盖主题：Public gardens and parks, Walking, The area you live in。逐句默写后，再把三句口头连起来。","items":[{"id":"M3-1","prompt":"住处附近有一个经常散步的公园。","answer":"There is a park by my apartment where I walk."},{"id":"M3-2","prompt":"小径和空气有助于活动与减压。","answer":"Its paths and air help me stay active and reduce stress."},{"id":"M3-3","prompt":"有时间会探索景色优美的海岸小径。","answer":"If I had time, I would explore coastal paths with beautiful scenery."}]},{"id":"m4","title":"M4 童年收藏与朋友","usage":"覆盖主题：Childhood activities, Life stages。逐句默写后，再把三句口头连起来。","items":[{"id":"M4-1","prompt":"童年喜欢向朋友展示首饰收藏。","answer":"As a child, I loved showing my jewellery collection to friends."},{"id":"M4-2","prompt":"朋友之间交换项链和耳环。","answer":"We exchanged necklaces and earrings."},{"id":"M4-3","prompt":"共同相处带来归属感和怀旧感。","answer":"Spending time together gave me a sense of belonging, and those simple moments still make me nostalgic."}]},{"id":"m5","title":"M5 大学女子赛艇队","usage":"覆盖主题：Sports team。逐句默写后，再把三句口头连起来。","items":[{"id":"M5-1","prompt":"大学时带领在海上训练的女子赛艇队。","answer":"At college, I led an all-female rowing team which trained on the sea."},{"id":"M5-2","prompt":"共同目标帮助队员建立默契。","answer":"Working towards one goal helped us build a strong rapport."},{"id":"M5-3","prompt":"艰苦而兴奋的日子令人自豪。","answer":"I remember those demanding but exciting days with genuine pride."}]},{"id":"m6","title":"M6 历史老师与小熊礼物","usage":"覆盖主题：Teachers, Gifts, History-related questions。逐句默写后，再把三句口头连起来。","items":[{"id":"M6-1","prompt":"最喜欢的是中学历史老师。","answer":"My favourite teacher taught history at school."},{"id":"M6-2","prompt":"考试失败后，她用小熊安慰我。","answer":"After I failed an exam, she comforted me with a teddy bear."},{"id":"M6-3","prompt":"她的善意恢复了我的信心，我仍保留小熊。","answer":"It was her kindness that restored my confidence, and I still keep it."}]},{"id":"m7","title":"M7 父亲、面包和蛋糕","usage":"覆盖主题：Food, Gifts, Childhood activities。逐句默写后，再把三句口头连起来。","items":[{"id":"M7-1","prompt":"从童年起就喜欢面包和蛋糕。","answer":"Bread and cake have been my favourites since childhood."},{"id":"M7-2","prompt":"父亲下班后会买来作早餐。","answer":"My father bought them for breakfast after work."},{"id":"M7-3","prompt":"被关爱的感受使它们比价格更重要。","answer":"Those treats made me feel cared for, so they matter more than their price."}]},{"id":"m8","title":"M8 Apple Watch、网站、耳机与打字","usage":"覆盖主题：Watch, Websites, Headphones, Typing, Memory。逐句默写后，再把三句口头连起来。","items":[{"id":"M8-1","prompt":"Apple Watch和线上工具简化日常流程。","answer":"My Apple Watch and online tools streamline my routine."},{"id":"M8-2","prompt":"用它们处理消息、日程、资源和提醒。","answer":"I use them for messages, schedules, resources and reminders."},{"id":"M8-3","prompt":"它们节省时间，但安全和专注时避免耳机或屏幕。","answer":"They save time, although I avoid headphones or screens when safety and concentration matter."}]},{"id":"m9","title":"M9 购物、比价与实用选择","usage":"覆盖主题：Shopping, Cars。逐句默写后，再把三句口头连起来。","items":[{"id":"M9-1","prompt":"喜欢购物，但会比较价格并重视实用价值。","answer":"I enjoy shopping, but I compare prices and focus on practical value."},{"id":"M9-2","prompt":"选择汽车时也遵循同样原则。","answer":"The same applies to cars: reliability, safety and reasonable cost matter more to me than a luxury brand or appearance."}]},{"id":"m10","title":"M10 科学、护理学习与太空兴趣","usage":"覆盖主题：Science, Outer space and stars。逐句默写后，再把三句口头连起来。","items":[{"id":"M10-1","prompt":"生物学与护理和患者照护直接相关。","answer":"Biology interests me because it connects with nursing and patient care."},{"id":"M10-2","prompt":"科学训练思维，纪录片简化概念。","answer":"Science strengthens my thinking, while documentaries simplify ideas."},{"id":"M10-3","prompt":"对太空感兴趣，但只有安全时才愿意前往。","answer":"Space also fascinates me, although I would only travel there if it became safe."}]},{"id":"m11","title":"M11 笑话、人际关系、礼物与宠物","usage":"覆盖主题：Jokes & Comedies, Gifts, Pets and Animals, The area you live in。逐句默写后，再把三句口头连起来。","items":[{"id":"M11-1","prompt":"笑声和贴心礼物能维持亲密关系。","answer":"Laughter and thoughtful gifts help people maintain close bonds."},{"id":"M11-2","prompt":"宠物提供陪伴，但饲养需要责任。","answer":"Pets provide companionship, but owning one requires responsibility."},{"id":"M11-3","prompt":"日程繁忙，只有能妥善照顾时才会领养。","answer":"Since my schedule is busy, I would only adopt an animal when I could care for it."}]},{"id":"m12","title":"M12 国际护士执照与五年目标","usage":"覆盖主题：Life stages, Websites, Teachers。逐句默写后，再把三句口头连起来。","items":[{"id":"M12-1","prompt":"目标是取得国际护士执照并发展职业。","answer":"My goal is to complete my international nursing licence and develop professionally."},{"id":"M12-2","prompt":"未来五年还要保护健康并陪伴家人。","answer":"Over the next five years, I want to protect my health and make time for family."},{"id":"M12-3","prompt":"现实的目标帮助自己保持动力。","answer":"Realistic goals help me maintain momentum."}]},{"id":"linkers","title":"16个连接表达","usage":"每次回答只选择一个主结构，再加一处简单连接，避免堆叠。","items":[{"id":"X01","prompt":"条件句：如果有机会，我会……","answer":"If I had the chance, I would…"},{"id":"X02","prompt":"条件句：如果它变得安全，我会……","answer":"If it became safe, I would…"},{"id":"X03","prompt":"定语从句：这帮助我……","answer":"which helps me…"},{"id":"X04","prompt":"定语从句：在那里我可以……","answer":"where I can…"},{"id":"X05","prompt":"There-be：曾经有一段时间……","answer":"There was a time when…"},{"id":"X06","prompt":"There-be：有几个原因可以解释……","answer":"There are several reasons why…"},{"id":"X07","prompt":"强调句：正是……使得……","answer":"It was … that …"},{"id":"X08","prompt":"切换话题：谈到……","answer":"When it comes to…"},{"id":"X09","prompt":"切换维度：在……方面","answer":"In terms of…"},{"id":"X10","prompt":"说明主要原因：主要是因为……","answer":"mainly because…"},{"id":"X11","prompt":"补充特定情境：尤其当……","answer":"especially when…"},{"id":"X12","prompt":"继续补充：除此以外……","answer":"On top of that, …"},{"id":"X13","prompt":"形成鲜明对比：然而／而……","answer":"whereas…"},{"id":"X14","prompt":"表达取舍：而不是……","answer":"rather than…"},{"i function words(value){return(value.toLowerCase().replace(/[’]/g,"'").match(/[a-z0-9]+(?:[-'][a-z0-9]+)*/g)||[])}
function isCorrect(typed,expected){return words(typed).join(' ')===words(expected).join(' ')}
function oneWordHint(typed,expected){const got=words(typed),want=words(expected);if(got.length!==want.length)return'';const wrong=[];for(let i=0;i<want.length;i+=1)if(got[i]!==want[i])wrong.push(i);return wrong.length===1?`拼写提示：${got[wrong[0]]} → ${want[wrong[0]]}`:''}
function wordAlignment(got,want){const m=got.length,n=want.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i+=1)dp[i][0]=i;for(let j=0;j<=n;j+=1)dp[0][j]=j;for(let i=1;i<=m;i+=1)for(let j=1;j<=n;j+=1)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(got[i-1]===want[j-1]?0:1));const good=Array(m).fill(false);let i=m,j=n;while(i>0||j>0){if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+(got[i-1]===want[j-1]?0:1)){good[i-1]=got[i-1]===want[j-1];i-=1;j-=1}else if(i>0&&dp[i][j]===dp[i-1][j]+1)i-=1;else j-=1}return good}
function paintMirror(mirror,typed,expected){mirror.replaceChildren();const typedWords=words(typed),expectedWords=words(expected),alignment=wordAlignment(typedWords,expectedWords);const parts=typed.match(/[A-Za-z0-9]+(?:[-'’][A-Za-z0-9]+)*|\s+|[^A-Za-z0-9\s]+/g)||[];let index=0;parts.forEach(part=>{const span=document.createElement('span');span.textContent=part;if(/^[A-Za-z0-9]/.test(part)){span.className=alignment[index]?'good':'bad';index+=1}mirror.appendChild(span)})}
function sectionProgress(panel){const all=panel.querySelectorAll('.item').length,done=panel.querySelectorAll('.item.correct').length;panel.querySelector('.progress').textContent=`${done} / ${all}`}
function unlockNext(item){const next=item.nextElementSibling;if(!next||!next.classList.contains('item'))return;next.classList.remove('locked');const input=next.querySelector('.answer-input');input.disabled=false;input.focus()}
function resetPanel(panel){panel.querySelectorAll('.item').forEach((item,index)=>{item.classList.remove('correct');item.classList.toggle('locked',index!==0);const input=item.querySelector('.answer-input');input.value='';input.disabled=index!==0;item.querySelector('.mirror').replaceChildren();const feedback=item.querySelector('.feedback');feedback.textContent='';feedback.className='feedback';item.querySelector('.revealed').classList.add('hidden');item.querySelector('.small').textContent='显示答案'});sectionProgress(panel)}

function renderStudySection(section,sectionIndex){const tabs=document.getElementById('tabs'),app=document.getElementById('app');const tab=document.createElement('button');tab.type='button';tab.className='tab'+(sectionIndex===0?' active':'');tab.textContent=section.title;tab.dataset.target=section.id;tabs.appendChild(tab);const panel=document.createElement('section');panel.id=section.id;panel.className='panel'+(sectionIndex===0?' active':'');const head=document.createElement('div');head.className='panel-head';const heading=document.createElement('div');const h2=document.createElement('h2');h2.textContent=section.title;const usage=document.createElement('p');usage.className='usage';usage.textContent=section.usage;heading.append(h2,usage);const progress=document.createElement('span');progress.className='progress';progress.textContent=`0 / ${section.items.length}`;head.append(heading,progress);panel.appendChild(head);
section.items.forEach((entry,itemIndex)=>{const item=document.createElement('article');item.className='item'+(itemIndex===0?'':' locked');const prompt=document.createElement('p');prompt.className='prompt';const code=document.createElement('span');code.className='code';code.textContent=entry.id;prompt.append(code,document.createTextNode(entry.prompt));const wrap=document.createElement('div');wrap.className='input-wrap';const mirror=document.createElement('div');mirror.className='mirror';mirror.setAttribute('aria-hidden','true');const input=document.createElement('textarea');input.className='answer-input';input.rows=2;input.disabled=itemIndex!==0;input.setAttribute('aria-label',`${entry.id} 英文答案`);input.autocomplete='off';input.spellcheck=false;wrap.append(mirror,input);const feedback=document.createElement('div');feedback.className='feedback';feedback.setAttribute('aria-live','polite');const actions=document.createElement('div');actions.className='actions';const show=document.createElement('button');show.type='button';show.className='small';show.textContent='显示答案';const revealed=document.createElement('div');revealed.className='revealed hidden';revealed.textContent=entry.answer;show.addEventListener('click',()=>{const hidden=revealed.classList.toggle('hidden');show.textContent=hidden?'显示答案':'隐藏答案'});actions.appendChild(show);input.addEventListener('input',()=>{paintMirror(mirror,input.value,entry.answer);if(isCorrect(input.value,entry.answer)){item.classList.add('correct');item.classList.remove('locked');input.disabled=true;mirror.textContent=entry.answer;feedback.textContent='正确，下一题已解锁。';feedback.className='feedback done';sectionProgress(panel);unlockNext(item)}else{const hint=oneWordHint(input.value,entry.answer);feedback.textContent=hint;feedback.className=hint?'feedback hint':'feedback'}});item.append(prompt,wrap,feedback,actions,revealed);panel.appendChild(item)});const foot=document.createElement('div');foot.className='panel-foot';const reset=document.createElement('button');reset.type='button';reset.className='reset';reset.textContent='重置本区';reset.addEventListener('click',()=>resetPanel(panel));foot.appendChild(reset);panel.appendChild(foot);app.appendChild(panel)}

let oralList=QUESTION_BANK.slice(),oralIndex=0;
function renderOralSection(){const tabs=document.getElementById('tabs'),app=document.getElementById('app');const tab=document.createElement('button');tab.type='button';tab.className='tab';tab.textContent='122题速答';tab.dataset.target='oral';tabs.appendChild(tab);const panel=document.createElement('section');panel.id='oral';panel.className='panel';panel.innerHTML='<div class="panel-head"><div><h2>122题快速开口</h2><p class="usage">看到题目后3秒内开口，说25–45词；完成后再显示题型、素材和建议开头。</p></div><span class="progress">122题</span></div><div class="oral-tools"><label>主题<select id="topic-filter"><option value="">全部24个主题</option></select></label><label>题型<select id="type-filter"><option value="">全部8类题型</option></select></label></div><article class="oral-card"><div class="oral-meta" id="oral-meta"></div><div class="oral-question" id="oral-question"></div><div class="oral-actions"><button class="nav-button" id="oral-prev" type="button">上一题</button><button class="nav-button" id="oral-next" type="button">下一题</button><button class="nav-button" id="oral-random" type="button">随机抽题</button><button class="reveal-cue" id="oral-reveal" type="button">显示作答提示</button></div><div class="cue hidden" id="oral-cue"></div><div class="counter" id="oral-counter"></div></article>';app.appendChild(panel);const topicSelect=panel.querySelector('#topic-filter'),typeSelect=panel.querySelector('#type-filter'),cue=panel.querySelector('#oral-cue');[...new Map(QUESTION_BANK.map(q=>[q.topicNumber,q])).values()].forEach(q=>{const option=document.createElement('option');option.value=String(q.topicNumber);option.textContent=`${q.topicNumber}. ${q.topic}`;topicSelect.appendChild(option)});[...new Map(QUESTION_BANK.map(q=>[q.type,q])).values()].sort((a,b)=>a.type.localeCompare(b.type)).forEach(q=>{const option=document.createElement('option');option.value=q.type;option.textContent=`${q.type} · ${q.typeName}`;typeSelect.appendChild(option)});function filter(){oralList=QUESTION_BANK.filter(q=>(!topicSelect.value||q.topicNumber===Number(topicSelect.value))&&(!typeSelect.value||q.type===typeSelect.value));oralIndex=0;showOral()}function showOral(){const q=oralList[oralIndex];cue.classList.add('hidden');panel.querySelector('#oral-reveal').textContent='显示作答提示';if(!q){panel.querySelector('#oral-question').textContent='没有符合条件的题目';panel.querySelector('#oral-meta').replaceChildren();panel.querySelector('#oral-counter').textContent='0 / 0';return}panel.querySelector('#oral-meta').innerHTML=`<span class="badge">${escapeHtml(q.type)} · ${escapeHtml(q.typeName)}</span><span class="badge">${escapeHtml(q.module)}</span><span class="badge">主题 ${q.topicNumber}</span>`;panel.querySelector('#oral-question').textContent=q.question;cue.innerHTML=`<strong>建议开头：</strong> ${escapeHtml(q.opening)}<br><strong>推荐素材：</strong> ${escapeHtml(q.module)}<br><strong>组合公式：</strong> 直接回应＋一个原因＋一个个人细节`;panel.querySelector('#oral-counter').textContent=`${oralIndex+1} / ${oralList.length} · ${q.topic} 第${q.questionNumber}题`}topicSelect.addEventListener('change',filter);typeSelect.addEventListener('change',filter);panel.querySelector('#oral-prev').addEventListener('click',()=>{if(!oralList.length)return;oralIndex=(oralIndex-1+oralList.length)%oralList.length;showOral()});panel.querySelector('#oral-next').addEventListener('click',()=>{if(!oralList.length)return;oralIndex=(oralIndex+1)%oralList.length;showOral()});panel.querySelector('#oral-random').addEventListener('click',()=>{if(!oralList.length)return;oralIndex=Math.floor(Math.random()*oralList.length);showOral()});panel.querySelector('#oral-reveal').addEventListener('click',event=>{const hidden=cue.classList.toggle('hidden');event.currentTarget.textContent=hidden?'显示作答提示':'隐藏作答提示'});showOral()}
function escapeHtml(value){const div=document.createElement('div');div.textContent=value;return div.innerHTML}

STUDY_SECTIONS.forEach(renderStudySection);renderOralSection();document.getElementById('tabs').addEventListener('click',event=>{const tab=event.target.closest('.tab');if(!tab)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===tab.dataset.target));document.getElementById(tab.dataset.target)?.querySelector('textarea:not(:disabled)')?.focus()});const resetAllButton=document.getElementById('reset-all');resetAllButton.addEventListener('click',()=>{if(resetAllButton.dataset.confirmed!=='yes'){resetAllButton.dataset.confirmed='yes';resetAllButton.textContent='再次点击确认清空';return}document.querySelectorAll('.panel:not(#oral)').forEach(resetPanel);delete resetAllButton.dataset.confirmed;resetAllButton.textContent='清空全部进度'});
</script>
</body>
