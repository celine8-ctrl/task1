<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>const expected='?id=1';if(location.search!==expected){try{history.replaceState(null,'',location.pathname+expected)}catch(e){location.search=expected}}</script><link rel="stylesheet" href="style.css"><title>Task 1 三段式默写卷</title></head><body><main><h1 id="title"></h1><p id="subtitle" class="sub"></p><nav id="nav" class="nav"></nav><section class="card"><div class="notice">输入正确的单词显示黑色；只有错误单词显示红色。单个单词拼错时会提示正确拼写。每道完全写对后才解锁下一道，大小写和标点不扣分。</div></section><section class="card"><span class="section-tag">第一部分</span><h2>最值得背诵</h2><p class="sub">来自《最值得背诵.md》，按题型选取。</p><div id="best"></div><button class="secondary" onclick="resetGroup('b')">本部分清空重做</button><div id="bestScore" class="score"></div></section><section class="card"><span class="section-tag">第二部分</span><h2>对应的必背重点</h2><p class="sub">来自《必背重点.md》中与本篇对应的章节。</p><div id="key"></div><button class="secondary" onclick="resetGroup('k')">本部分清空重做</button><div id="keyScore" class="score"></div></section><section class="card"><span class="section-tag">第三部分</span><h2>20 分钟全文限时默写</h2><div class="task-area"><div id="task" class="prompt"></div><img id="chart" class="chart" alt="对应题目图表"><p id="focus" class="hint"></p></div><div id="timer" class="timer">20:00</div><div id="count" class="metrics">已写：0 词｜最低要求：150 词</div><textarea id="write" disabled oninput="updateCount()" placeholder="点击“计时开始”后，根据上方题目和图表默写全文……"></textarea><p><button id="start" onclick="startTimer()">计时开始</button> <button class="secondary" onclick="toggle('cnbox')">显示中文</button> <button class="secondary" onclick="toggle('refbox')">显示英文范文</button> <button class="secondary" onclick="selfCheck()">自查完成度</button> <button class="secondary" onclick="clearWriting()">清空作答</button></p><div id="self" class="score hidden"></div><div id="cnbox" class="translation hidden"><span id="cn"></span></div><div id="refbox" class="answer hidden"><span id="reference"></span></div><p class="rule">倒计时归零后自动停止作答。检查：Overview、时态、数字、单位、比较关系、单复数与拼写。</p></section></main><script src="translations.js"></script><script src="data.js"></script><script src="app.js"></script></body></html>
